<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เช็คอิน · IT Open House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --ink:#14162B; --paper:#F5F3EE; --violet:#6C5CE7;
    --ok:#1E7B3B; --ok-bg:#EAF7EE; --err:#B23A2C; --err-bg:#FDEDEB; --warn-bg:#FFF6E3; --warn:#8A6415;
    --text-dim:#6B7280; --line:#E7E3D8;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'IBM Plex Sans Thai',sans-serif;background:var(--ink);color:#fff;min-height:100vh;}
  h1,h2,.display{font-family:'Kanit',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* login gate */
  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{background:#fff;color:var(--ink);border-radius:16px;padding:36px 30px;width:100%;max-width:360px;}
  .login-card .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--violet);text-transform:uppercase;margin:0 0 8px;}
  .login-card h1{font-size:20px;margin:0 0 20px;}
  .login-card input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;margin-bottom:12px;font-family:inherit;}
  .login-card button{width:100%;padding:13px;border:none;border-radius:10px;background:var(--ink);color:#fff;font-family:'Kanit',sans-serif;font-weight:600;font-size:15px;cursor:pointer;}
  .login-err{color:var(--err);font-size:13px;margin-top:8px;display:none;}

  /* scanner screen */
  #scanScreen{display:none;max-width:480px;margin:0 auto;padding:20px 16px 40px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:#22D3C5;text-transform:uppercase;margin:0;}
  .topbar h1{font-size:19px;margin:2px 0 0;}
  .count{font-family:'IBM Plex Mono',monospace;font-size:13px;color:#9AA0C4;}

  #reader{border-radius:16px;overflow:hidden;border:2px solid #2A2D52;}
  #reader video{border-radius:14px;}

  .result{margin-top:16px;border-radius:14px;padding:18px 20px;display:none;}
  .result.show{display:block;}
  .result.ok{background:var(--ok-bg);color:var(--ok);}
  .result.err{background:var(--err-bg);color:var(--err);}
  .result.warn{background:var(--warn-bg);color:var(--warn);}
  .result .name{font-family:'Kanit',sans-serif;font-size:20px;font-weight:600;margin:0 0 4px;}
  .result .sub{font-size:13.5px;margin:0;}

  .hint{margin-top:16px;text-align:center;color:#6B7280;font-size:13px;}
  .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22D3C5;margin-right:6px;animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
</style>
</head>
<body>

<!-- LOGIN GATE -->
<div id="loginScreen">
  <div class="login-card">
    <p class="eyebrow">Staff only</p>
    <h1>เข้าสู่ระบบสแกนเช็คอิน</h1>
    <input type="password" id="pwInput" placeholder="รหัสผ่านทีมงาน" autofocus>
    <button id="loginBtn">เข้าสู่ระบบ</button>
    <p class="login-err" id="loginErr">รหัสผ่านไม่ถูกต้อง หรือเชื่อมต่อไม่สำเร็จ</p>
  </div>
</div>

<!-- SCANNER -->
<div id="scanScreen">
  <div class="topbar">
    <div>
      <p class="eyebrow"><span class="status-dot"></span>IT Open House</p>
      <h1>สแกน QR เช็คอิน</h1>
    </div>
    <div class="count mono">เช็คอินแล้ว: <span id="checkinCount">0</span></div>
  </div>

  <div id="reader"></div>

  <div class="result" id="result">
    <p class="name" id="resultName"></p>
    <p class="sub" id="resultSub"></p>
  </div>

  <p class="hint">เล็งกล้องไปที่ QR Code ของนักเรียน ระบบจะสแกนอัตโนมัติ</p>
</div>

<script>
  // TODO: วาง URL ของ Google Apps Script Web App ที่ deploy แล้ว (URL เดียวกับ index.html และ dashboard.html)
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/XXXXXXXXXXXXXXXXXXXXXXXX/exec";

  let sessionPassword = '';
  let scanner = null;
  let checkinCount = 0;
  let isProcessing = false;

  const loginScreen = document.getElementById('loginScreen');
  const scanScreen = document.getElementById('scanScreen');
  const loginErr = document.getElementById('loginErr');
  const resultBox = document.getElementById('result');
  const resultName = document.getElementById('resultName');
  const resultSub = document.getElementById('resultSub');

  document.getElementById('loginBtn').addEventListener('click', login);
  document.getElementById('pwInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });

  async function login() {
    const pw = document.getElementById('pwInput').value;
    if (!pw) return;
    loginErr.style.display = 'none';

    // ทดสอบรหัสผ่านด้วยการเรียก getData แบบเบาๆ ก่อนเปิดกล้อง
    try {
      const res = await fetch(`${APPS_SCRIPT_URL}?action=getData&password=${encodeURIComponent(pw)}`);
      const result = await res.json();
      if (!result.success) throw new Error(result.error || 'รหัสผ่านไม่ถูกต้อง');

      sessionPassword = pw;
      checkinCount = result.data.filter(r => r['เช็คอิน'] === 'เช็คอินแล้ว').length;
      document.getElementById('checkinCount').textContent = checkinCount;

      loginScreen.style.display = 'none';
      scanScreen.style.display = 'block';
      startScanner();
    } catch (err) {
      loginErr.textContent = err.message;
      loginErr.style.display = 'block';
    }
  }

  function startScanner() {
    scanner = new Html5Qrcode('reader');
    scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      onScanSuccess,
      () => {} // เรียกทุกเฟรมที่สแกนไม่เจอ ไม่ต้องทำอะไร
    ).catch(err => {
      alert('เปิดกล้องไม่สำเร็จ: ' + err + '\nตรวจสอบว่าอนุญาตสิทธิ์กล้อง และเปิดผ่าน https:// เท่านั้น');
    });
  }

  async function onScanSuccess(decodedText) {
    if (isProcessing) return;
    isProcessing = true;

    try {
      const url = `${APPS_SCRIPT_URL}?action=checkin&password=${encodeURIComponent(sessionPassword)}&id=${encodeURIComponent(decodedText)}`;
      const res = await fetch(url);
      const result = await res.json();

      if (result.success) {
        checkinCount++;
        document.getElementById('checkinCount').textContent = checkinCount;
        showResult('ok', '✓ ' + result.name, 'เช็คอินสำเร็จ · ' + (result.major || ''));
        beep(660);
      } else if (result.alreadyCheckedIn) {
        showResult('warn', result.name || 'เช็คอินซ้ำ', result.error);
        beep(330);
      } else {
        showResult('err', 'ไม่พบข้อมูล', result.error || 'QR Code นี้ไม่ถูกต้อง');
        beep(220);
      }
    } catch (err) {
      showResult('err', 'เชื่อมต่อไม่สำเร็จ', err.message);
    }

    // เว้นจังหวะสั้นๆ ก่อนสแกนคนถัดไป กันสแกนซ้ำรัว
    setTimeout(() => { isProcessing = false; }, 1800);
  }

  function showResult(type, name, sub) {
    resultBox.className = 'result show ' + type;
    resultName.textContent = name;
    resultSub.textContent = sub;
  }

  function beep(freq) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.frequency.value = freq;
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.12);
    } catch (e) { /* เบราว์เซอร์บางตัวอาจไม่รองรับ เสียงไม่ใช่ส่วนจำเป็น */ }
  }
</script>
</body>
</html>
